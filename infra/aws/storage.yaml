AWSTemplateFormatVersion: '2010-09-09'
Description: CodeCampus private content storage and least-privilege ECS task role
Resources:
  ContentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: CleanupIncompleteMultipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Application
          Value: CodeCampus
        - Key: DataClassification
          Value: PrivateEducationalContent
  ContentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ContentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ContentBucket.Arn
              - !Sub '${ContentBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: LimitSignedURLAge
            Effect: Deny
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${ContentBucket.Arn}/private/*'
            Condition:
              NumericGreaterThan:
                s3:signatureAge: '60000'
  ContentAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Private content operations only; no ACLs or bucket administration
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:AbortMultipartUpload
            Resource: !Sub '${ContentBucket.Arn}/private/*'
  ApplicationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref ContentAccessPolicy
Outputs:
  BucketName:
    Value: !Ref ContentBucket
  TaskRoleArn:
    Value: !GetAtt ApplicationTaskRole.Arn
  ContentPolicyArn:
    Value: !Ref ContentAccessPolicy
